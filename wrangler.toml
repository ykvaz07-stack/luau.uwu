name = "scriptshield"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# OpenNext adapter output
[build]
command = "npm run build"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Env vars: set production secrets in the Cloudflare Pages dashboard
# (Settings → Environment variables) — do NOT commit real values below.
# These are only placeholders for local `wrangler dev` runs.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "placeholder"
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "placeholder"
SUPABASE_SERVICE_ROLE_KEY = "placeholder"
NEXT_PUBLIC_ADMIN_EMAIL = ""
NEXT_PUBLIC_SITE_URL = "https://project.luacrypt.workers.dev"
RESEND_API_KEY = "placeholder"
